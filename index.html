<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulasi Energi</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #081827;
      color: #edf8ff;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(560px, calc(100% - 40px));
      padding: 32px;
      border-radius: 20px;
      background: #153149;
    }
    h1 { margin-top: 0; }
    p { color: #b8d4e3; line-height: 1.5; }
    a {
      display: block;
      margin-top: 24px;
      padding: 17px 20px;
      border-radius: 12px;
      background: #59ddce;
      color: #092f35;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Simulasi Energi</h1>
    <p>Pilih simulasi yang ingin kamu mainkan.</p>
